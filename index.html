<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mindmap PPT Demo</title>
    <link rel="stylesheet" href="./src/styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <section class="presentation-frame">
        <div id="mindmap" role="region" aria-label="思维导图自由画布">
          <div class="map-layer" id="mapLayer">
            <svg class="link-layer" id="linkLayer" aria-hidden="true"></svg>
            <div class="node-layer" id="nodeLayer"></div>
          </div>
        </div>

        <section class="floating-ui" aria-label="Presentation controls">
          <div class="title-panel">
            <p class="deck-context" id="deckSubtitle">Markdown Mindmap</p>
            <h1 id="deckTitle">root</h1>
          </div>

          <div class="controls" aria-label="逻辑单元演示操作区">
            <button
              class="controls-toggle"
              id="controlsToggle"
              type="button"
              aria-expanded="true"
              aria-controls="controlsBody"
              aria-label="收起控制面板"
              title="收起控制面板"
            >
              <span aria-hidden="true">×</span>
            </button>
            <div class="control-main" id="controlsBody">
              <div class="transport">
                <button class="step-button" id="previousStepButton" type="button" aria-label="上一个逻辑单元" title="上一个逻辑单元">←</button>
                <input id="nodeSlider" type="range" min="0" max="0" value="0" aria-label="快速定位逻辑单元" />
                <span class="counter" id="counter">1 / 1</span>
                <button class="step-button" id="nextStepButton" type="button" aria-label="下一个逻辑单元" title="下一个逻辑单元">→</button>
              </div>
              <div class="control-details">
                <div class="next-unit" aria-live="polite">
                  <span class="control-label">下一单元</span>
                  <span class="next-content has-subtitle" id="nextNodePreview">
                    <span class="node-subtitle" id="nextNodeSubtitle">即将进入</span>
                    <span class="node-title" id="nextNodeTitle">root</span>
                  </span>
                </div>
                <div class="view-tools" aria-label="画布视图设置">
                  <button id="fitViewButton" type="button">适应画布</button>
                  <label class="zoom-row" for="zoomSlider">
                    <input id="zoomSlider" type="range" min="5" max="200" value="100" aria-label="调整画布缩放" />
                    <strong id="zoomValue">100%</strong>
                  </label>
                </div>
              </div>
            </div>
          </div>
        </section>
      </section>
    </main>

    <script type="module" src="./src/main.js"></script>
  </body>
</html>
